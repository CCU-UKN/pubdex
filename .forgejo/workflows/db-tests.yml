# Forgejo Actions adapter around the repository's complete verification suite,
# the counterpart of .github/workflows/db-tests.yml. Everything this job
# verifies lives in run_ci_suite.sh and the tracked scripts it calls: the job
# checks the repository out with its history, creates .venv with
# ./setup_venv.sh, installs the pinned helm, kubectl and kind under .tools/
# with ./setup_cluster_tools.sh, pulls the pinned SBOM tool, Syft's image by
# digest, with ./release.sh setup, and runs the eleven stages of
# ./run_ci_suite.sh with the event's commit range.
#
# The job publishes nothing. A test release never leaves the runner's
# machine, and no step logs in to a registry, pushes an image, a chart, an
# archive or a tag, or runs the publish step of release.sh, which is the
# maintainer's alone (RELEASING.md). The job reads no repository secret.
#
# It needs a Forgejo Runner that has the label below as a host label
# (pubdex-ci-host:host), so that the job runs directly on a machine meeting
# the runner contract in DB/TESTING_STRATEGY.md, "Running the suite
# elsewhere", with python3.11 on PATH, a C compiler and libpq's headers with
# pg_config for psycopg's C implementation, and Node.js for the checkout
# action.
# Stages 6 and 7 build the application image and start the Compose
# deployment, so that machine needs Docker Engine 28.0.1 or later, except
# 28.2.0 to 28.3.2, with the buildx plugin and the Compose plugin 2.24.0 or later
# (DB/lib/docker_versions.sh), a daemon on the same machine whose socket the
# job's user may use, and access to the registries and the package index
# unless Docker has the images and packages already. The tool setup needs
# HTTPS access to the downloads DB/lib/cluster_tools.sh names, and sha256sum;
# the SBOM tool's setup needs Docker Hub, without credentials.
# Stage 9 creates two kind clusters on that daemon, one after the other, so
# the daemon has to run kind's node as a privileged container and publish
# each cluster's API server on 127.0.0.1, and stage 9 needs openssl, kind's
# two node images by digest unless Docker has them, and from inside the
# nodes, without credentials, the registry of the published images
# (ghcr.io). Stages 9 to 11 build test releases with release.sh, which needs
# GNU tar, gzip, sha256sum and cmp, and stage 11 pulls the published images
# from that registry through the daemon, unless Docker has them. A runner
# that runs jobs in containers does not meet it.
#
# The checkout action is GitHub's actions/checkout at the commit the GitHub
# workflow pins, fetched from Forgejo's mirror by absolute URL. No action
# installs Python, because actions/setup-python downloads its interpreters
# from GitHub; the runner provides python3.11, and the suite's log records
# the versions each run used. pip and the packages, helm, kubectl, kind, the
# SBOM tool and the images are pinned, fetched and installed as in the GitHub
# workflow.
# Forgejo documents `permissions:` as ignored, so none is set; the automatic
# token is not stored in the checkout.
name: DB tests

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: pubdex-ci-host
    # The same limit as the GitHub workflow, for the same estimate: the
    # eleven stages took about 23 minutes on a workstation and are estimated
    # at 26 to 32 on a hosted runner, where no run of them has been measured;
    # the limit is about twice that. Forgejo Runner ends a job at its limit
    # with SIGKILL, which skips the running stage's cleanup
    # (DB/TESTING_STRATEGY.md, "Forgejo Actions").
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Full history: the transform-version guard and the check of the
          # pushed or proposed commits read the commit range, the version
          # guard reads the commit of the PubDex release VERSION names, once
          # that release is published, and stage 9 takes the chart of the
          # preceding PubDex release from its commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: ./setup_venv.sh --python python3.11
      - name: Install the pinned cluster tools
        run: ./setup_cluster_tools.sh
      - name: Pull the pinned SBOM tool
        run: ./release.sh setup
      - name: Run the complete verification suite
        # Forgejo runs a pull request's head commit, not a merge commit, so
        # its range starts at the merge base the event names. A push starts
        # at the previous tip; the first push of a branch or tag reports an
        # all-zero SHA, for which the transform-version guard has no range
        # and the secrets check reads every commit reachable from the head.
        env:
          BASE: ${{ forgejo.event.pull_request.merge_base || forgejo.event.before }}
          HEAD: ${{ forgejo.sha }}
        run: ./run_ci_suite.sh --base "$BASE" --head "$HEAD"
