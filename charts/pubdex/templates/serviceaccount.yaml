{{- /*
One ServiceAccount per component, without an API token: no PubDex
container talks to the Kubernetes API, and the chart grants no role.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pubdex.apiName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pubdex.labels" (dict "root" $ "component" "api") | nindent 4 }}
automountServiceAccountToken: false
---
# The ingestion pods': the CronJobs' runs, the demonstration and the attached
# one-off pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pubdex.ingestName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pubdex.labels" (dict "root" $ "component" "ingest") | nindent 4 }}
automountServiceAccountToken: false
{{- if eq .Values.mode "evaluation" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pubdex.postgresqlName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pubdex.labels" (dict "root" $ "component" "postgresql") | nindent 4 }}
automountServiceAccountToken: false
---
# The schema upgrade's Jobs'; in external mode a hook of their own creates
# it (schema-upgrade-job.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pubdex.schemaUpgradeName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pubdex.labels" (dict "root" $ "component" "schema-upgrade") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
