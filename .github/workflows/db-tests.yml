# GitHub adapter around the repository's complete verification suite.
# Everything this job verifies lives in run_ci_suite.sh and the tracked scripts
# it calls, so the same result is reproducible from a clone and on any other
# forge: ./setup_venv.sh creates .venv -- the locked files fetched over HTTPS
# and checked against their hashes, then installed by pip from those files
# alone, psycopg's C implementation built against the runner's libpq --
# ./setup_cluster_tools.sh installs the helm, kubectl and kind that
# DB/lib/cluster_tools.sh pins under .tools/, each checked against its pinned
# SHA-256 and never the runner's own, ./release.sh setup pulls the SBOM tool
# that DB/lib/sbom_tool.sh pins, Syft's image by digest and without
# credentials, and then ./run_ci_suite.sh runs its eleven stages. Only the
# checkout and the interpreter are GitHub-specific here.
# The Docker-backed stages use the runner's own Docker Engine and Compose
# plugin: stages 6 and 7 build the images from this checkout and start the
# Compose deployment; stage 9 builds test releases of the checkout with
# release.sh and runs the Helm chart on two kind clusters, one after the
# other, that it creates on that Engine and deletes afterwards; stage 10
# rehearses a PubDex release, building a test release twice and verifying
# it; and stage 11 upgrades the Compose deployment between test releases and
# from the published images.
#
# The job publishes nothing. A test release never leaves the runner, and no
# step logs in to a registry, pushes an image, a chart, an archive or a tag,
# or runs the publish step of release.sh, which is the maintainer's alone
# (RELEASING.md). The job's token can only read the repository, and the
# checkout does not keep it. The job needs no service container, existing
# cluster, registry login or repository secret.
#
# The inputs that would otherwise move are fixed: a runner image release, the
# actions by commit, an exact Python version, and pip and every package at an
# exact version and by hash (DB/requirements-pip.txt, DB/requirements-build.txt,
# then DB/requirements-dev.txt), no package built from source but psycopg-c
# from its verified archive, and no pip but the locked one run, never with
# access to an index; helm, kubectl and kind at an exact version and by
# SHA-256, and kind's two node images by digest (DB/lib/cluster_tools.sh); the
# SBOM tool's image by digest (DB/lib/sbom_tool.sh); and the preceding PubDex
# release, which stages 9 and 11 start before they upgrade to this
# checkout's, its images by the digests of the release record (releases/) and
# its chart at the commit that record names. The runner image still receives
# updates -- its compiler, libpq, Docker Engine, tar and gzip among them --
# and the setup's and the suite's logs record the versions each run used
# (DB/TESTING_STRATEGY.md, "Reproducing a verified run").
name: DB tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    # The eleven stages took about 23 minutes on a workstation, about 10 of
    # them in stage 9 with its two kind clusters. The first nine, as they
    # stood for task 2b, took about 14 minutes there and 15 to 18 minutes in
    # their three runs on this hosted runner, which builds the images without
    # a cache, and the job's other steps about one more (TASK_2B.md records
    # two of those runs). At those ratios this job is estimated at 26 to 32
    # minutes. No run of the eleven stages on a hosted runner has been
    # measured, so the limit is about twice the estimate: a job that reaches
    # its limit ends without a result.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Full history: the transform-version guard and the check of the
          # pushed or proposed commits read the commit range, the version
          # guard reads the commit of the PubDex release VERSION names, once
          # that release is published, and stage 9 takes the chart of the
          # preceding PubDex release from its commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11.18"
      - name: Install dependencies
        run: ./setup_venv.sh --python python
      - name: Install the pinned cluster tools
        run: ./setup_cluster_tools.sh
      - name: Pull the pinned SBOM tool
        run: ./release.sh setup
      - name: Run the complete verification suite
        # On a pull request the base is the target commit; on a push it is the
        # previous tip. The first push of a new branch reports an empty or
        # all-zero SHA: the transform-version guard then has no range to
        # check, and the secrets check reads every commit reachable from HEAD.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: ./run_ci_suite.sh --base "$BASE" --head "$HEAD"
